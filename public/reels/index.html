<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Mirrors the netlify.toml header so the policy also holds behind the blog proxy.
       frame-ancestors is header-only (browsers ignore it in a meta tag), so it is not repeated here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Reels · Asifur Rahaman</title>
  <meta name="description" content="Links, commands and resources mentioned in Asifur Rahaman's Instagram reels. Find a reel by its number.">
  <link rel="canonical" href="https://asifurrahaman.com/reels/">
  <meta name="theme-color" content="#f2e8d5">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1e3c'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-weight='700' font-size='17' fill='%23f26a2e'%3E%23%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/reels/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/reels/fonts/poppins-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/reels/reels.json" as="fetch" type="application/json" crossorigin>
  <link rel="modulepreload" href="/reels/schema.js">
  <link rel="stylesheet" href="/reels/styles.css">
  <script type="module" src="/reels/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#reel-list">Skip to reels</a>

  <div class="page">
    <header class="about" aria-labelledby="profile-name">
      <p class="pinned"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3l6 6-3 1-4 4 1 5-2 1-4-4-5 5-1-1 5-5-4-4 1-2 5 1 4-4z"/></svg>Pinned · About me</p>
      <h1 id="profile-name" class="name">Asifur Rahaman</h1>
      <p id="profile-tagline" class="tagline">Links and resources from my reels.</p>
      <ul id="profile-links" class="profile-links" aria-label="Find me elsewhere"></ul>
    </header>

    <main>
      <div class="controls" role="search">
        <label class="search-label" for="search">Search reels</label>
        <input id="search" class="search" type="search" placeholder="Number, title or tag, e.g. 02"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <div id="tag-chips" class="chips" role="group" aria-label="Filter by tag"></div>
      </div>

      <p id="status" class="status" role="status">Loading reels…</p>

      <ol id="reel-list" class="reel-list" tabindex="-1" aria-label="Reels, newest first"></ol>

      <div id="empty" class="empty" hidden>
        <p class="empty-title">No reels match that.</p>
        <p>Try the number from the caption (like <span class="mono">02</span>) or a different tag.</p>
        <button id="clear-filters" type="button" class="clear-btn">Clear search and filters</button>
      </div>

      <noscript><p class="status">This page needs JavaScript to list the reels.</p></noscript>
    </main>

    <footer class="site-footer">
      <p><a href="https://asifurrahaman.com">asifurrahaman.com</a></p>
      <p class="fine">Fonts: <a href="/reels/fonts/OFL-Poppins.txt">Poppins</a> and
        <a href="/reels/fonts/OFL-JetBrainsMono.txt">JetBrains Mono</a>, SIL Open Font License 1.1.</p>
    </footer>
  </div>

  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
